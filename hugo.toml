baseURL = "https://churchcrm.io/"
languageCode = "en-us"
title = "ChurchCRM - Free CRM Solution for Churches"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
uglyURLs = true
enableRobotsTXT = true
cleanDestinationDir = true
disableKinds = []

[taxonomies]
  tag = "tags"

[params]
  googleAnalyticsID = "G-4F7K8Z3T5J"
  description = "ChurchCRM exists to serve the Church — free, open-source tools for every congregation, in every country, in every language. No fees. No lock-in. Your data."
  keywords = "church crm, church management, church software, giving, attendance, open source"
  authorLinkedIn = "https://www.linkedin.com/in/gdawoud/"

[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.en]
    contentDir = "content/en"
    languageName = "English"
    languageCode = "en"
    weight = 1
    [languages.en.params]
      locale = "en_US"

  [languages.es]
    contentDir = "content/es"
    languageName = "Español"
    languageCode = "es"
    weight = 2
    [languages.es.params]
      locale = "es_ES"

  [languages.pt]
    contentDir = "content/pt"
    languageName = "Português"
    languageCode = "pt"
    weight = 3
    [languages.pt.params]
      locale = "pt_BR"

  [languages.zh]
    contentDir = "content/zh"
    languageName = "中文"
    languageCode = "zh"
    weight = 4
    [languages.zh.params]
      locale = "zh_CN"

  [languages.fr]
    contentDir = "content/fr"
    languageName = "Français"
    languageCode = "fr"
    weight = 5
    [languages.fr.params]
      locale = "fr_FR"

  [languages.ru]
    contentDir = "content/ru"
    languageName = "Русский"
    languageCode = "ru"
    weight = 6
    [languages.ru.params]
      locale = "ru_RU"

  [languages.de]
    contentDir = "content/de"
    languageName = "Deutsch"
    languageCode = "de"
    weight = 7
    [languages.de.params]
      locale = "de_DE"

  [languages.ar]
    contentDir = "content/ar"
    languageName = "العربية"
    languageCode = "ar"
    weight = 8
    [languages.ar.params]
      locale = "ar_SA"
