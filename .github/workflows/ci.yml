name: Website CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.165.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Hugo site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          hugo version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production site
        run: hugo --minify

      - name: Validate canonical URLs, hreflang, sitemap, and redirects
        run: node scripts/check-url-normalization.mjs

      - name: Validate titles, descriptions, social metadata, and JSON-LD
        run: node scripts/check-metadata.mjs

      - name: Validate every published blog post is listed on /blog/
        run: node scripts/check-blog-listing.mjs

      - name: Check requirement versions
        run: node scripts/check-requirements.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
