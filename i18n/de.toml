other = "Bereit zu sehen, ob ChurchCRM zu Ihrer Gemeinde passt?"

[prod_cta_try_demo]
other = "Live-Demo ausprobieren"

[prod_faq_a1]
other = "Ja. ChurchCRM unterstützt CSV-Import für Mitglieder- und Familiendaten sowie Datenbankwiederherstellung für eine vollständige Migration. Die Einrichtungszeit hängt davon ab, wie viel Bereinigung Ihre bestehenden Daten benötigen."

[prod_faq_a2]
other = "Plugins und Integrationen gibt es. Individuelle Plugins erfordern Entwicklerkenntnisse, aber der Quellcode ist offen — Sie können jemanden beauftragen, das zu bauen, was Sie brauchen."

[prod_faq_a3]
other = "Nein. ChurchCRM ist eine Webanwendung. Ihr IT-Verantwortlicher kann es auf einem lokalen Server betreiben, wenn Sie kein Internet haben, aber das ist fortgeschritten."

[prod_faq_a4]
other = "Integrierte Rollen und Berechtigungen. Backups hängen von Ihrem Hosting ab — Shared Hosting umfasst sie in der Regel; bei Eigenhosting liegt es in Ihrer Verantwortung."

