[prod_faq_title]
other = "Häufige Fragen"

[prod_fit_1]
other = "<strong>Praktische Gemeindeverwaltung benötigen</strong> — Mitgliederverzeichnis, Gruppen, Anwesenheit, Spenden, Freiwillige."

[prod_fit_2]
other = "<strong>Ihre Daten selbst besitzen wollen</strong> — kein Anbieter-Lock-in, kein Abo-Druck."

[prod_fit_3]
other = "<strong>Eigenhosting oder einfaches Hosting bevorzugen</strong> — können auf günstigem Shared Hosting oder eigenem Server bereitgestellt werden."

[prod_fit_4]
other = "<strong>In mehreren Sprachen arbeiten</strong> — profitieren von Community-Übersetzungen in 49 Sprachen."

[prod_fit_intro]
other = "ChurchCRM eignet sich am besten für Gemeinden, die:"

[prod_fit_not]
other = "<strong>ChurchCRM passt möglicherweise nicht, wenn:</strong> Ihre Gemeinde integrierte E-Mail-Kampagnen, kostenpflichtige mobile Apps, telefonischen Anbieter-Support oder schlüsselfertiges Ticketing für Veranstaltungen benötigt. Das ist in Ordnung — das sind legitime Bedürfnisse, und es gibt Produkte, die dafür konzipiert sind. Wir helfen Ihnen, Ihre Optionen zu verstehen."

[prod_fit_title]
other = "Ist ChurchCRM das Richtige für Ihre Gemeinde?"

[prod_hero_lead]
other = "ChurchCRM hilft Gemeinden, Personen, Gruppen, Veranstaltungen, Spenden und Freiwillige zu verwalten — und Sie behalten die volle Kontrolle über Ihre Daten. Kostenlos. Kein Abo. Open Source. Selbst gehostet."

[prod_hero_title]
other = "Kostenlose Gemeindeverwaltungssoftware für Gemeinden, die organisiert bleiben wollen"

[prod_hosting_1]
other = "<strong>Vorhandener Server oder gespendetes Hosting:</strong> 0 $/Monat. Wenn Ihre Gemeinde bereits einen Server hat oder jemand Hosting gespendet hat, entstehen möglicherweise keine zusätzlichen Kosten."

[prod_hosting_2]
other = "<strong>Shared Hosting:</strong> 3–10 $/Monat. Einfache Einrichtung. Funktioniert für die meisten Gemeinden. Keine technischen Kenntnisse nötig, außer den Installationsanleitungen zu folgen."

[prod_hosting_3]
other = "<strong>Docker / VPS:</strong> 5–50 $/Monat je nach Traffic. ChurchCRM wird mit Docker entwickelt und getestet, aber es gibt kein offiziell gepflegtes Produktions-Image — Ihr IT-Freiwilliger ist dafür verantwortlich, den Container aktuell und sicher zu halten. Volle Kontrolle, mehr Verantwortung."

[prod_hosting_intro]
other = "<strong>Die Software ist kostenlos. Die Hostingkosten hängen davon ab, was Ihnen zur Verfügung steht.</strong>"

[prod_hosting_intro2]
other = "ChurchCRM läuft auf einem Standard-Webserver (PHP + MySQL). Ihre Kosten hängen davon ab, wie Sie hosten:"

[prod_hosting_tip]
other = "<strong>Profi-Tipp:</strong> Der E-Mail-Versand kann zusätzlich kosten (10–20 $/Monat, wenn Sie viele E-Mails versenden). Das ist optional und unabhängig von ChurchCRM."

[prod_hosting_title]
other = "Eigenhosting verstehen"

[prod_pf_export_body]
other = "Eine zentrale Seite für Datenexporte — Mitglieder-CSV, ChMeetings-Migration und vollständiges Datenbank-Backup — damit Ihre Daten nie eingeschlossen sind."

[prod_pf_export_title]
other = "Export-Hub"

[prod_pf_kiosk_body]
other = "Selbstbedienungs-Check-in-Kioske funktionieren jetzt mit jedem Gruppentyp — Bibelstudien, Jugendgruppen, Ausschüsse und mehr — nicht nur mit Sonntagsschulklassen."

[prod_pf_kiosk_title]
other = "Kiosk für alle Gruppen"

[prod_pf_lang_body]
other = "Von der Community beigetragene Übersetzungen in 49 Sprachen, mit automatischer Browsererkennung, sprachlichen Überschreibungen pro Nutzer und regionaler Gruppierung, um Ihre Sprache schnell zu finden."

[prod_pf_lang_title]
other = "49 Sprachen"

[prod_pf_maps_body]
other = "Interaktive Karten über OpenStreetMap — kein Google-Konto, kein API-Schlüssel, keine Abrechnung. Nominatim-Geocodierung integriert. Funktioniert sofort bei jeder Installation."

[prod_pf_maps_title]
other = "Karten ohne Konfiguration"

[prod_pf_plugins_body]
other = "Integrierte Anbindungen für MailChimp, OpenLP und Vonage SMS, plus ein Community-Plugin-System mit sicherheitsgeprüftem Installer, um weitere über das Admin-Panel hinzuzufügen — ohne manuelle Dateibearbeitung."

[prod_pf_plugins_title]
other = "Plugin-Ökosystem"

[prod_pf_ui_body]
other = "Gebaut mit Tabler und Bootstrap 5. Übersichtliche Layouts, Dunkelmodus, Akzentfarben pro Nutzer und ein voll responsives Design für Tablets und Desktops."

[prod_pf_ui_title]
other = "Moderne Oberfläche"

[prod_platform_eyebrow]
