[prod_wf_events_title]
other = "Veranstaltungen planen und Anwesenheit erfassen"

[prod_wf_giving_body]
other = "Spenden erfassen, Spendenmuster verfolgen, Finanzberichte erstellen und Spendenübersichten für Steuerbescheinigungen generieren. Keine externe Buchhaltung erforderlich — ChurchCRM erledigt, was Gemeinden brauchen."

[prod_wf_giving_title]
other = "Spenden und Finanzen im Blick behalten"

