# Install Page
[install_page_title]
other = "ChurchCRM installieren"

[install_page_subtitle]
other = "ChurchCRM ist kostenlose Open-Source-Software, die Sie selbst hosten. Wählen Sie den passenden Ansatz für Ihr Hosting und folgen Sie dann den vollständigen Schritten in der Dokumentation."

[install_hero_image_alt]
other = "Das ChurchCRM-Dashboard, der Startbildschirm nach abgeschlossener Installation"

[install_cost_title]
other = "Die Software ist kostenlos. Hosting ist separat."

[install_cost_note]
other = "ChurchCRM hat keine Lizenzgebühr und kein Abonnement. Sie brauchen dennoch einen Ort, um es zu betreiben, daher zahlen Sie möglicherweise einem Hosting-Anbieter für Server, Domainnamen und Backups. Kosten und Aufwand hängen von dem unten gewählten Ansatz ab."

[install_approaches_title]
other = "Installationsansatz wählen"

[install_approach_softaculous_who]
other = "Am besten, wenn Ihre Gemeinde kein technisches Personal hat."

[install_approach_cpanel_who]
other = "Am besten, wenn Sie cPanel-Hosting ohne Softaculous haben."

[install_approach_direct_who]
other = "Am besten, wenn Sie einen Systemadministrator haben oder Ihren eigenen Server verwalten."

[install_approach_docs]
other = "Vollständige Anleitung ansehen"

[install_wizard_video_alt]
other = "Rundgang durch den ChurchCRM-Einrichtungsassistenten"

[install_wizard_note]
other = "Jeder Ansatz endet gleich: Sie öffnen Ihre neue ChurchCRM-Adresse im Browser, und ein Einrichtungsassistent führt Sie durch die Verbindung zur Datenbank und die Erstellung Ihres Admin-Kontos."

[install_req_intro]
other = "Die meisten Shared-Hosting-Pakete erfüllen dies bereits. Fragen Sie im Zweifel Ihren Anbieter."

[install_req_php_value]
other = "8.4 oder neuer"

[install_req_db_value]
other = "MySQL 8.0+ oder MariaDB 10.5+"

[install_req_server_value]
other = "Apache oder nginx mit aktiviertem URL-Rewriting"

[install_req_disk_value]
other = "Etwa 500 MB zum Starten"

[install_req_full_docs]
other = "Die Dokumentation listet die genauen erforderlichen PHP-Erweiterungen, Datenbankberechtigungen und Speichereinstellungen für ChurchCRM auf."

[install_not_sure_title]
other = "Noch unsicher?"

[install_not_sure_desc]
other = "Probieren Sie zuerst die Live-Demo aus, um zu sehen, ob ChurchCRM zur Arbeitsweise Ihrer Gemeinde passt, und kommen Sie dann zur Installation zurück."

[install_choose_method]
other = "ChurchCRM läuft auf Standard-PHP- und MySQL-Hosting. Der richtige Ansatz hängt davon ab, was Ihr Hoster bietet und ob Sie technische Unterstützung haben."

