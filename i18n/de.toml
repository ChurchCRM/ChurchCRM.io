[prod_wf_groups_title]
other = "Gruppen und Dienste organisieren"

[prod_wf_people_body]
other = "Führen Sie ein einziges, durchsuchbares Verzeichnis von Mitgliedern und Familien. Erfassen Sie Kontaktdaten, Notizen, seelsorgerliche Betreuung und Fotos. Suchen Sie nach Name, Adresse oder Telefonnummer."

[prod_wf_people_title]
other = "Verwalten Sie Ihre Mitglieder und Familien"

[prod_wf_reports_body]
other = "Erstellen Sie Anwesenheitstrends, Spendenanalysen und Mitgliedschaftsberichte. Exportieren Sie Daten für tiefergehende Analysen oder zur Archivierung. Volle Kontrolle — Ihre Daten bleiben in Ihren Händen."

[prod_wf_reports_title]
other = "Berichte und Einblicke"

[prod_wf_volunteers_body]
