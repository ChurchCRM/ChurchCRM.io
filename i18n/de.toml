[prod_platform_lead]
other = "ChurchCRM kommt mit einer modernen Oberfläche und einem wachsenden Satz an Plattformfunktionen, aktiv gepflegt und mit jeder Version verbessert."

[prod_platform_title]
other = "Eine moderne Oberfläche, eine leistungsstarke Plattform"

