other = "Questions fréquentes"

[prod_fit_1]
other = "<strong>Ont besoin d'une gestion pratique de l'église</strong> — annuaire des membres, groupes, présences, dons, bénévoles."

[prod_fit_2]
other = "<strong>Veulent être propriétaires de leurs données</strong> — sans dépendance à un fournisseur, sans pression d'abonnement."

[prod_fit_3]
other = "<strong>Préfèrent l'auto-hébergement ou un hébergement simple</strong> — peuvent le déployer sur un hébergement mutualisé abordable ou leur propre serveur."

[prod_fit_4]
other = "<strong>Travaillent en plusieurs langues</strong> — profitent de traductions communautaires dans 49 langues."

[prod_fit_intro]
other = "ChurchCRM fonctionne le mieux pour les églises qui :"

[prod_fit_not]
other = "<strong>ChurchCRM n'est peut-être pas adapté si :</strong> votre église a besoin de campagnes d'e-mails intégrées, d'applications mobiles payantes, d'un support téléphonique fournisseur ou d'une billetterie d'événements clé en main. Ce n'est pas grave — ce sont des besoins légitimes, et il existe des produits conçus pour cela. Nous vous aiderons à comprendre vos options."

[prod_fit_title]
other = "ChurchCRM est-il adapté à votre église ?"

[prod_hero_lead]
other = "ChurchCRM aide les églises à gérer les personnes, les groupes, les événements, les dons et les bénévoles — et vous gardez le contrôle total de vos données. Gratuit. Sans abonnement. Open source. Auto-hébergé."

[prod_hero_title]
other = "Logiciel gratuit de gestion d'église pour les églises qui veulent rester organisées"

[prod_hosting_1]
other = "<strong>Serveur existant ou hébergement donné :</strong> 0 $/mois. Si votre église a déjà un serveur ou que quelqu'un a fait don d'un hébergement, vous n'aurez peut-être aucun coût supplémentaire."

[prod_hosting_2]
other = "<strong>Hébergement mutualisé :</strong> 3–10 $/mois. Configuration facile. Convient à la plupart des églises. Aucune compétence technique requise au-delà de suivre les guides d'installation."

[prod_hosting_3]
other = "<strong>Docker / VPS :</strong> 5–50 $/mois selon le trafic. ChurchCRM est développé et testé avec Docker, mais il n'existe pas d'image de production officiellement maintenue — votre bénévole informatique est responsable de garder le conteneur à jour et sécurisé. Contrôle total, plus de responsabilité."

[prod_hosting_intro]
other = "<strong>Le logiciel est gratuit. Les coûts d'hébergement dépendent de ce dont vous disposez.</strong>"

[prod_hosting_intro2]
other = "ChurchCRM tourne sur un serveur web standard (PHP + MySQL). Vos coûts dépendent de la façon dont vous l'hébergez :"

[prod_hosting_tip]
other = "<strong>Astuce :</strong> L'envoi d'e-mails peut coûter un supplément (10–20 $/mois si vous envoyez beaucoup d'e-mails). C'est optionnel et distinct de ChurchCRM."

[prod_hosting_title]
other = "Comprendre l'auto-hébergement"

[prod_pf_export_body]
