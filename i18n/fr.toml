[prod_faq_a1]
other = "Oui. ChurchCRM prend en charge l'import CSV pour les données de membres et de familles, ainsi que la restauration de base de données pour une migration complète. Le temps de configuration dépend de l'ampleur du nettoyage nécessaire sur vos données existantes."

[prod_faq_a2]
other = "Des plugins et intégrations existent. Les plugins personnalisés nécessitent des compétences de développement, mais le code source est ouvert — vous pouvez engager quelqu'un pour construire ce dont vous avez besoin."

[prod_faq_a3]
other = "Non. ChurchCRM est une application web. Votre responsable informatique peut le faire tourner sur un serveur local si vous n'avez pas Internet, mais c'est une configuration avancée."

[prod_faq_a4]
other = "Des rôles et permissions intégrés. Les sauvegardes dépendent de votre hébergement — l'hébergement mutualisé les inclut généralement ; l'auto-hébergement est de votre responsabilité."

