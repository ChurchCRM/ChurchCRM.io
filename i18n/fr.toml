# Install Page
[install_page_title]
other = "Installer ChurchCRM"

[install_page_subtitle]
other = "ChurchCRM est un logiciel gratuit et open source que vous hébergez vous-même. Choisissez l'approche adaptée à votre hébergement, puis suivez les étapes complètes dans la documentation."

[install_hero_image_alt]
other = "Le tableau de bord de ChurchCRM, l'écran d'accueil une fois l'installation terminée"

[install_cost_title]
other = "Le logiciel est gratuit. L'hébergement est séparé."

[install_cost_note]
other = "ChurchCRM n'a ni frais de licence ni abonnement. Vous avez tout de même besoin d'un endroit pour l'exécuter, vous paierez donc peut-être un hébergeur pour le serveur, le nom de domaine et les sauvegardes. Le coût et l'effort dépendent de l'approche choisie ci-dessous."

[install_approaches_title]
other = "Choisissez une approche d'installation"

[install_approach_softaculous_who]
other = "Idéal si votre église n'a pas de personnel technique."

[install_approach_cpanel_who]
other = "Idéal si vous avez un hébergement cPanel sans Softaculous."

[install_approach_direct_who]
other = "Idéal si vous avez un administrateur système ou gérez votre propre serveur."

[install_approach_docs]
other = "Voir le guide complet"

[install_wizard_video_alt]
other = "Présentation de l'assistant de configuration de ChurchCRM"

[install_wizard_note]
other = "Chaque approche se termine de la même façon : vous ouvrez votre nouvelle adresse ChurchCRM dans un navigateur, et un assistant de configuration vous guide pour connecter la base de données et créer votre compte administrateur."

[install_req_intro]
other = "La plupart des offres d'hébergement mutualisé remplissent déjà ces conditions. Vérifiez auprès de votre hébergeur en cas de doute."

[install_req_php_value]
other = "8.4 ou plus récent"

[install_req_db_value]
other = "MySQL 8.0+ ou MariaDB 10.5+"

[install_req_server_value]
other = "Apache ou nginx avec la réécriture d'URL activée"

[install_req_disk_value]
other = "Environ 500 Mo pour commencer"

[install_req_full_docs]
other = "La documentation répertorie la liste complète des extensions PHP, des permissions de base de données et des réglages de mémoire requis par ChurchCRM."

[install_not_sure_title]
other = "Pas encore sûr ?"

[install_not_sure_desc]
other = "Essayez d'abord la démo en direct pour voir si ChurchCRM correspond au fonctionnement de votre église, puis revenez pour l'installer."

[install_choose_method]
other = "ChurchCRM fonctionne sur un hébergement PHP et MySQL standard. La bonne approche dépend de ce que propose votre hébergeur et de votre niveau d'aide technique."

[install_method_softaculous]
other = "Installation en un clic via Softaculous"

[install_method_softaculous_desc]
other = "Si votre hébergeur propose cPanel avec Softaculous, ChurchCRM s'installe en quelques clics, sans téléversement manuel de fichiers ni configuration de base de données."

[install_method_cpanel]
other = "Installation manuelle via cPanel"

[install_method_cpanel_desc]
other = "Créez une base de données, téléversez les fichiers avec le gestionnaire de fichiers de cPanel, puis ouvrez votre site pour lancer l'assistant de configuration."

[install_method_direct]
other = "Serveur auto-hébergé"

[install_method_direct_desc]
other = "Installez sur votre propre VPS ou serveur Linux pour un contrôle total sur la configuration, les mises à jour et les sauvegardes."

