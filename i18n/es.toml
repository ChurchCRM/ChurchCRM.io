# Install Page
[install_page_title]
other = "Instalar ChurchCRM"

[install_page_subtitle]
other = "ChurchCRM es software gratuito y de código abierto que usted mismo aloja. Elija el método que se ajuste a su alojamiento y luego siga los pasos completos en la documentación."

[install_hero_image_alt]
other = "El panel de ChurchCRM, la pantalla principal tras finalizar la instalación"

[install_cost_title]
other = "El software es gratuito. El alojamiento es aparte."

[install_cost_note]
other = "ChurchCRM no tiene cuota de licencia ni suscripción. Aun así necesita un lugar donde ejecutarlo, por lo que podría pagar a un proveedor de alojamiento por el servidor, el dominio y las copias de seguridad. El costo y el esfuerzo dependen del método que elija a continuación."

[install_approaches_title]
other = "Elija un método de instalación"

[install_approach_softaculous_who]
other = "Lo mejor si su iglesia no cuenta con personal técnico."

[install_approach_cpanel_who]
other = "Lo mejor si tiene alojamiento cPanel sin Softaculous."

[install_approach_direct_who]
other = "Lo mejor si cuenta con un administrador de sistemas o gestiona su propio servidor."

[install_approach_docs]
other = "Ver la guía completa"

[install_wizard_video_alt]
other = "Recorrido por el asistente de configuración de ChurchCRM"

[install_wizard_note]
other = "Todos los métodos terminan igual: abre la nueva dirección de ChurchCRM en un navegador y un asistente de configuración lo guía para conectar la base de datos y crear su cuenta de administrador."

[install_req_intro]
other = "La mayoría de los planes de alojamiento compartido ya cumplen esto. Consulte a su proveedor si no está seguro."

[install_req_php_value]
other = "8.4 o más reciente"

[install_req_db_value]
other = "MySQL 8.0+ o MariaDB 10.5+"

[install_req_server_value]
other = "Apache o nginx con reescritura de URL habilitada"

[install_req_disk_value]
other = "Alrededor de 500 MB para empezar"

[install_req_full_docs]
other = "La documentación tiene la lista completa de extensiones de PHP, permisos de base de datos y configuración de memoria que necesita ChurchCRM."

[install_not_sure_title]
other = "¿Aún no está seguro?"

[install_not_sure_desc]
other = "Pruebe primero la demo en vivo para ver si ChurchCRM se ajusta a la forma de trabajar de su iglesia, y luego vuelva para instalarlo."

[install_choose_method]
other = "ChurchCRM funciona con alojamiento estándar de PHP y MySQL. El método adecuado depende de lo que ofrezca su proveedor y si cuenta con ayuda técnica."

[install_method_softaculous]
other = "Instalación con un clic mediante Softaculous"

[install_method_softaculous_desc]
other = "Si su proveedor ofrece cPanel con Softaculous, ChurchCRM se instala en pocos clics, sin subir archivos manualmente ni configurar la base de datos."

[install_method_cpanel]
other = "Instalación manual con cPanel"

[install_method_cpanel_desc]
other = "Cree una base de datos, suba los archivos con el Administrador de archivos de cPanel y luego abra su sitio para ejecutar el asistente de configuración."

[install_method_direct]
other = "Servidor autoalojado"

[install_method_direct_desc]
other = "Instale en su propio VPS o servidor Linux para tener control total sobre la configuración, las actualizaciones y las copias de seguridad."

