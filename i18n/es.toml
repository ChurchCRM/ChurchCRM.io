other = "Flujos de trabajo comunes"

[prod_workflows_lead]
other = "Nada de listas de funciones. Estos son los trabajos reales que ChurchCRM ayuda a las iglesias a hacer."

[prod_workflows_title]
other = "Lo que las iglesias logran con ChurchCRM"

