[prod_faq_title]
other = "Perguntas frequentes"

[prod_fit_1]
other = "<strong>Precisam de gestão prática da igreja</strong> — diretório de membros, grupos, presença, doações, voluntários."

[prod_fit_2]
other = "<strong>Querem ser donos dos próprios dados</strong> — sem dependência de fornecedor, sem pressão de assinatura."

[prod_fit_3]
other = "<strong>Preferem autoalojamento ou hospedagem simples</strong> — podem implantar em hospedagem compartilhada acessível ou em servidor próprio."

[prod_fit_4]
other = "<strong>Trabalham em vários idiomas</strong> — se beneficiam de traduções da comunidade em 49 idiomas."

[prod_fit_intro]
other = "O ChurchCRM funciona melhor para igrejas que:"

[prod_fit_not]
other = "<strong>O ChurchCRM pode não ser adequado se:</strong> Sua igreja precisa de campanhas de e-mail integradas, aplicativos móveis pagos, suporte telefônico do fornecedor ou emissão de ingressos para eventos pronta para uso. Tudo bem — essas são necessidades legítimas, e existem produtos feitos para elas. Vamos ajudar você a entender suas opções."

[prod_fit_title]
other = "O ChurchCRM é adequado para a sua igreja?"

[prod_hero_lead]
other = "O ChurchCRM ajuda igrejas a gerenciar pessoas, grupos, eventos, doações e voluntários — e você mantém total controle sobre seus dados. Grátis. Sem assinatura. Código aberto. Autoalojado."

[prod_hero_title]
other = "Software gratuito de gestão de igrejas para igrejas que querem se manter organizadas"

[prod_hosting_1]
other = "<strong>Servidor existente ou hospedagem doada:</strong> US$ 0/mês. Se sua igreja já tem um servidor ou alguém doou hospedagem, pode não haver custo adicional."

[prod_hosting_2]
other = "<strong>Hospedagem compartilhada:</strong> US$ 3–10/mês. Configuração fácil. Funciona para a maioria das igrejas. Nenhuma habilidade técnica necessária além de seguir os guias de instalação."

[prod_hosting_3]
other = "<strong>Docker / VPS:</strong> US$ 5–50/mês dependendo do tráfego. O ChurchCRM é desenvolvido e testado com Docker, mas não há uma imagem de produção oficialmente mantida — seu voluntário de TI é responsável por manter o contêiner atualizado e seguro. Controle total, mais responsabilidade."

[prod_hosting_intro]
other = "<strong>O software é gratuito. Os custos de hospedagem dependem do que você já tem disponível.</strong>"

[prod_hosting_intro2]
other = "O ChurchCRM roda em um servidor web padrão (PHP + MySQL). Seus custos dependem de como você hospeda:"

[prod_hosting_tip]
other = "<strong>Dica:</strong> O envio de e-mails pode custar a mais (US$ 10–20/mês se você enviar muitos e-mails). Isso é opcional e separado do ChurchCRM."

[prod_hosting_title]
other = "Entendendo o autoalojamento"

[prod_pf_export_body]
other = "Uma página central para exportação de dados — CSV de membros, migração do ChMeetings e backup completo do banco de dados — para que seus dados nunca fiquem presos."

[prod_pf_export_title]
other = "Central de exportação"

[prod_pf_kiosk_body]
other = "Os quiosques de autoatendimento para check-in agora funcionam com todo tipo de grupo — estudos bíblicos, grupos de jovens, comitês e mais — não apenas turmas de Escola Dominical."

[prod_pf_kiosk_title]
other = "Quiosque para todos os grupos"

[prod_pf_lang_body]
other = "Traduções feitas pela comunidade em 49 idiomas, com detecção automática do navegador, substituição de idioma por usuário e agrupamento regional para encontrar seu idioma rapidamente."

[prod_pf_lang_title]
other = "49 idiomas"

[prod_pf_maps_body]
other = "Mapas interativos via OpenStreetMap — sem conta do Google, sem chave de API, sem cobrança. Geocodificação Nominatim integrada. Funciona imediatamente em cada instalação."

[prod_pf_maps_title]
other = "Mapas sem configuração"

[prod_pf_plugins_body]
other = "Integrações nativas com MailChimp, OpenLP e SMS Vonage, além de um sistema de plugins da comunidade com instalador revisado por segurança para adicionar mais a partir do painel de administração — sem edição manual de arquivos."

[prod_pf_plugins_title]
other = "Ecossistema de plugins"

[prod_pf_ui_body]
other = "Construído com Tabler e Bootstrap 5. Layouts limpos, modo escuro, cores de destaque por usuário e um design totalmente responsivo para tablets e desktops."

[prod_pf_ui_title]
other = "Interface moderna"

[prod_platform_eyebrow]
other = "Destaques da plataforma"

[prod_platform_lead]
other = "O ChurchCRM vem com uma interface moderna e um conjunto crescente de recursos de plataforma, ativamente mantidos e aprimorados a cada versão."

[prod_platform_title]
other = "Uma interface moderna, uma plataforma poderosa"

[prod_shots_caption]
other = "Painel e atividade em um relance."

