# Installation
[install_heading]
other = "Visão Geral da Instalação"

[install_description]
other = "O ChurchCRM é instalado em hospedagem LAMP padrão. Veja o fluxo simplificado — as instruções detalhadas passo a passo estão no guia de instalação."

[install_step_1_title]
other = "Verificar Requisitos"

[install_step_1_desc]
other = "Confirme que seu servidor possui PHP 8.4+, MySQL 8.0+ e Apache com mod_rewrite. A maioria das hospedagens suporta essa configuração padrão."

[install_step_2_title]
other = "Baixar e Enviar"

[install_step_2_desc]
other = "Baixe o ChurchCRM do GitHub, extraia os arquivos e envie-os para sua conta de hospedagem usando FTP ou o gerenciador de arquivos do seu provedor."

