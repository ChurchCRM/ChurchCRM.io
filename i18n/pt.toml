[prod_faq_a1]
other = "Sim. O ChurchCRM suporta importação de CSV para dados de membros e famílias, além de restauração de banco de dados para uma migração completa. O tempo de configuração depende de quanto ajuste seus dados atuais precisam."

[prod_faq_a2]
other = "Existem plugins e integrações. Plugins personalizados exigem habilidades de desenvolvimento, mas o código-fonte é aberto — você pode contratar alguém para construir o que precisa."

[prod_faq_a3]
other = "Não. O ChurchCRM é uma aplicação web. A pessoa de TI da sua igreja pode rodá-lo em um servidor local se você não tiver internet, mas isso é avançado."

[prod_faq_a4]
other = "Papéis e permissões integrados. Os backups dependem da sua hospedagem — hospedagens compartilhadas geralmente os incluem; hospedagem própria é sua responsabilidade."

