other = "Crie e gerencie eventos, acompanhe a presença em cultos e programas, e use quiosques de autoatendimento para check-in. Funciona para Escola Dominical, estudos bíblicos, grupos de jovens e mais."

[prod_wf_events_title]
other = "Planeje eventos e acompanhe a presença"

[prod_wf_giving_body]
other = "Registre doações, acompanhe padrões de contribuição, gere relatórios financeiros e produza extratos de doação para comprovantes fiscais. Nenhuma contabilidade externa necessária — o ChurchCRM cuida do que as igrejas precisam."

[prod_wf_giving_title]
other = "Acompanhe doações e finanças"

[prod_wf_groups_body]
other = "Acompanhe pequenos grupos, estudos bíblicos, comitês, voluntários e equipes ministeriais. Gerencie associação e papéis de grupos, e envie e-mails de grupo do mesmo lugar."

[prod_wf_groups_title]
other = "Organize grupos e ministérios"

[prod_wf_people_body]
other = "Mantenha um diretório único e pesquisável de membros e famílias. Registre informações de contato, notas, cuidado pastoral e fotos. Pesquise por nome, endereço ou telefone."

[prod_wf_people_title]
other = "Gerencie suas pessoas e famílias"

[prod_wf_reports_body]
other = "Gere tendências de presença, análises de doações e relatórios de membros. Exporte dados para análise mais profunda ou arquivamento. Controle total — seus dados ficam em suas mãos."

[prod_wf_reports_title]
other = "Relatórios e insights"

[prod_wf_volunteers_body]
other = "Cadastro em autoatendimento e verificação de membros. Acompanhe as oportunidades de voluntariado nas quais os membros se inscreveram. Reduza a entrada manual de dados na papelada de novos membros."

[prod_wf_volunteers_title]
other = "Voluntários e integração de membros"

