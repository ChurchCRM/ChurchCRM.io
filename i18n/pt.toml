# Install Page
[install_page_title]
other = "Instalar o ChurchCRM"

[install_page_subtitle]
other = "O ChurchCRM é um software gratuito e de código aberto que você mesmo hospeda. Escolha a abordagem que combina com sua hospedagem e siga os passos completos na documentação."

[install_hero_image_alt]
other = "O painel do ChurchCRM, a tela inicial depois de concluir a instalação"

[install_cost_title]
other = "O software é gratuito. A hospedagem é separada."

[install_cost_note]
other = "O ChurchCRM não tem taxa de licença nem assinatura. Mesmo assim, você precisa de um lugar para executá-lo, então pode pagar a um provedor de hospedagem pelo servidor, domínio e backups. O custo e o esforço dependem da abordagem escolhida abaixo."

[install_approaches_title]
other = "Escolha uma abordagem de instalação"

[install_approach_softaculous_who]
other = "Melhor se sua igreja não tem equipe técnica."

[install_approach_cpanel_who]
other = "Melhor se você tem hospedagem cPanel sem Softaculous."

[install_approach_direct_who]
other = "Melhor se você tem um administrador de sistemas ou gerencia seu próprio servidor."

[install_approach_docs]
other = "Ver o guia completo"

[install_wizard_note]
other = "Toda abordagem termina da mesma forma: você abre o novo endereço do ChurchCRM no navegador, e um assistente de configuração ajuda a conectar o banco de dados e criar sua conta de administrador."

[install_req_intro]
other = "A maioria dos planos de hospedagem compartilhada já atende a isso. Consulte seu provedor se tiver dúvidas."

[install_req_php_value]
other = "8.4 ou mais recente"

[install_req_db_value]
other = "MySQL 8.0+ ou MariaDB 10.5+"

[install_req_server_value]
other = "Apache ou nginx com reescrita de URL habilitada"

[install_req_disk_value]
other = "Cerca de 500 MB para começar"

[install_req_full_docs]
other = "A documentação traz a lista completa de extensões PHP, permissões de banco de dados e configurações de memória que o ChurchCRM precisa."

[install_not_sure_title]
other = "Ainda não tem certeza?"

[install_not_sure_desc]
other = "Experimente primeiro a demonstração ao vivo para ver se o ChurchCRM combina com o funcionamento da sua igreja, depois volte para instalar."

[install_choose_method]
other = "O ChurchCRM funciona em hospedagem padrão de PHP e MySQL. A abordagem certa depende do que sua hospedagem oferece e se você tem ajuda técnica."

[install_method_softaculous]
other = "Instalação com um clique via Softaculous"

[install_method_softaculous_desc]
other = "Se sua hospedagem oferece cPanel com Softaculous, o ChurchCRM é instalado em poucos cliques, sem upload manual de arquivos ou configuração de banco de dados."

