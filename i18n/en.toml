# Homepage — 2026 editorial redesign (layouts/index.html)
# ─────────────────────────────────────────────────────────────
[home_why_eyebrow]
other = "Why ChurchCRM exists"

[home_why_statement]
other = "ChurchCRM was created as a service to the Church — not as a product to sell to it."

[home_why_p1]
other = "It began because churches needed a way to keep track of the people they serve, and the tools available asked them to pay monthly for the privilege of storing their own congregation's information."

[home_why_p2]
other = "Today it is maintained in the open by developers and church staff who use it themselves. Every change is public. Every install belongs to the church running it."

[home_people_eyebrow]
other = "01 — People"

[home_people_title]
other = "Start with your people."

[home_people_body]
other = "People and families are the foundation of everything else. Records, relationships, roles and history live together, so the rest of the system has something real to stand on."

[home_people_link]
other = "Read the people & families docs"

[home_work_eyebrow]
other = "02 — The work"

[home_work_title]
other = "Organize the work of the church."

[home_work_body]
other = "Groups, events, attendance and communication — the things a church actually does week to week, handled without spreadsheets in between."

[home_work_groups]
other = "Groups"

[home_work_groups_detail]
other = "Roles, membership, assignment"

[home_work_events]
other = "Events"

[home_work_events_detail]
other = "Calendar and check-in"

[home_work_attendance]
other = "Attendance"

[home_work_attendance_detail]
other = "Recorded over time"

[home_work_communication]
other = "Communication"

[home_work_communication_detail]
other = "Email and letters"

[home_giving_eyebrow]
other = "03 — Giving"

[home_giving_title]
other = "Keep track of giving and finances."

[home_giving_body]
other = "Pledges, deposits, funds and statements — enough structure to be accountable to your congregation, without turning the office into an accounting department."

[home_own_eyebrow]
other = "You own your data"

[home_own_statement]
other = "Your congregation's information stays on the server you chose, under the terms you set."

[home_own_free_title]
