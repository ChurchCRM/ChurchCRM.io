[prod_hero_title]
other = "Free church management software for churches that want to stay organized"

[prod_hero_lead]
other = "ChurchCRM helps churches manage people, groups, events, giving, and volunteers — and you keep full control of your data. Free. No subscription. Open source. Self-hosted."

[prod_cta_try_demo]
other = "Try live demo"

[prod_cta_install]
other = "Install ChurchCRM"

[prod_why_free_title]
other = "Free. No subscription."

[prod_why_free_body]
other = "Zero software costs. No recurring fees. Download it once, use it forever."

[prod_why_data_title]
other = "You own your data."

[prod_why_data_body]
other = "Self-hosted and open source. Export anytime. Never dependent on a vendor."

[prod_why_lang_title]
other = "49 languages."

[prod_why_lang_body]
other = "Community-built translations. Auto-detect. Per-user language choice."

[prod_why_community_title]
other = "Community-driven."

[prod_why_community_body]
other = "Open source. Plugins. Extensible. No black boxes."

[prod_workflows_eyebrow]
other = "Common workflows"

[prod_workflows_title]
other = "What churches accomplish with ChurchCRM"

[prod_workflows_lead]
other = "No feature dump. Here are the real jobs ChurchCRM helps churches do."

[prod_wf_people_title]
other = "Manage your people and families"

[prod_wf_people_body]
other = "Keep a single, searchable directory of members and families. Track contact info, notes, pastoral care, and photos. Search by name, address, or phone number."

[prod_wf_groups_title]
other = "Organize groups and ministries"

[prod_wf_groups_body]
other = "Track small groups, bible studies, committees, volunteers, and ministry teams. Manage group membership and roles, and send group email from the same place."

[prod_wf_events_title]
other = "Plan events and track attendance"

[prod_wf_events_body]
other = "Create and manage events, track attendance for services and programs, and use self-service kiosks for check-in. Works for Sunday School, Bible studies, youth groups, and more."

[prod_wf_giving_title]
other = "Track giving and finances"

[prod_wf_giving_body]
other = "Record donations, track giving patterns, run financial reports, and generate giving reports for tax statements. No external accounting required — ChurchCRM handles what churches need."

[prod_wf_volunteers_title]
other = "Volunteers and member onboarding"

[prod_wf_volunteers_body]
other = "Self-service registration and member verification. Track volunteer opportunities members have signed up for. Reduce manual data entry for new member paperwork."

[prod_wf_reports_title]
other = "Reports and insights"

[prod_wf_reports_body]
other = "Generate attendance trends, giving analysis, and membership reports. Export data for deeper analysis or archive. Full control — your data stays in your hands."

[prod_fit_title]
other = "Is ChurchCRM right for your church?"

[prod_fit_intro]
other = "ChurchCRM works best for churches that:"

[prod_fit_1]
other = "<strong>Need practical church management</strong> — member directory, groups, attendance, giving, volunteers."

[prod_fit_2]
other = "<strong>Want to own their data</strong> — no vendor lock-in, no subscription pressure."

[prod_fit_3]
other = "<strong>Prefer self-hosting or simple hosting</strong> — can deploy to affordable shared hosting or their own server."

[prod_fit_4]
other = "<strong>Work in multiple languages</strong> — benefit from community translations in 49 languages."

[prod_fit_not]
other = "<strong>ChurchCRM may not be the fit if:</strong> Your church needs integrated email campaigns, paid mobile apps, vendor phone support, or turnkey event ticketing. That's okay — those are legitimate needs, and there are products designed for them. We'll help you understand your options."

[prod_hosting_title]
other = "Understanding self-hosting"

[prod_hosting_intro]
other = "<strong>The software is free. Hosting costs depend on what you have available.</strong>"

[prod_hosting_intro2]
other = "ChurchCRM runs on a standard web server (PHP + MySQL). Your costs depend on how you host:"

[prod_hosting_1]
other = "<strong>Existing server or donated hosting:</strong> $0/month. If your church already has a server or someone has donated hosting, you may have no additional cost."

[prod_hosting_2]
other = "<strong>Shared hosting:</strong> $3–10/month. Easy setup. Works for most churches. No technical skills required beyond following installation guides."

[prod_hosting_3]
other = "<strong>Docker / VPS:</strong> $5–50/month depending on traffic. ChurchCRM is developed and tested with Docker, but there is no officially maintained production image — your IT volunteer is responsible for keeping the container patched and secure. Full control, more responsibility."

[prod_hosting_tip]
other = "<strong>Pro tip:</strong> Email delivery may cost extra ($10–20/month if you send many emails). This is optional and separate from ChurchCRM."

[prod_faq_title]
other = "Common questions"

[prod_faq_q1]
other = "Can we migrate from another system?"

[prod_faq_a1]
other = "Yes. ChurchCRM supports CSV import for member and family data, plus database restore for a full migration. Setup time depends on how much cleanup your existing data needs."

[prod_faq_q2]
other = "What if we need customization?"

[prod_faq_a2]
other = "Plugins and integrations exist. Custom plugins require developer skills but source code is open — you can hire someone to build what you need."

[prod_faq_q3]
other = "Can we use it offline?"

[prod_faq_a3]
other = "No. ChurchCRM is a web application. Your IT person can run it on a local server if you have no internet, but that's advanced."

[prod_faq_q4]
other = "What about security and backups?"

[prod_faq_a4]
other = "Built-in roles and permissions. Backups depend on your hosting — shared hosts usually include them; DIY hosting is your responsibility."

