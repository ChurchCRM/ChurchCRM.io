[prod_pf_ui_body]
other = "Built with Tabler and Bootstrap 5. Clean layouts, dark mode, per-user accent colors, and a fully responsive design for tablets and desktops."

[prod_pf_plugins_title]
other = "Plugin ecosystem"

[prod_pf_plugins_body]
other = "Built-in integrations for MailChimp, OpenLP, and Vonage SMS, plus a community plugin system with a security-reviewed installer for adding more from the Admin panel — no manual file editing."

[prod_pf_maps_title]
other = "Zero-config maps"

[prod_pf_maps_body]
other = "Interactive maps via OpenStreetMap — no Google account, no API key, no billing. Nominatim geocoding built in. Works immediately on every install."

[prod_pf_kiosk_title]
other = "Kiosk for all groups"

[prod_pf_kiosk_body]
other = "Self-service check-in kiosks now work with every group type — Bible studies, youth groups, committees, and more — not just Sunday School classes."

[prod_pf_export_title]
other = "Export hub"

[prod_pf_export_body]
other = "One central page for data exports — member CSV, ChMeetings migration, and full database backup — so your data is never locked in."

