# Install Page
[install_page_title]
other = "Install ChurchCRM"

[install_page_subtitle]
other = "ChurchCRM is free, open-source software that you host yourself. Pick the approach that matches your hosting, then follow the full steps in the documentation."

[install_hero_image_alt]
other = "The ChurchCRM dashboard, the home screen after you finish installing"

[install_cost_title]
other = "The software is free. Hosting is separate."
[install_cost_note]
other = "ChurchCRM has no license fee and no subscription. You still need somewhere to run it, so you may pay a hosting provider for the server, domain name, and backups. Cost and effort depend on the approach you choose below."

[install_approaches_title]
other = "Choose an installation approach"

[install_choose_method]
other = "ChurchCRM runs on standard PHP and MySQL hosting. The right approach depends on what your host provides and whether you have technical help."

[install_method_softaculous]
other = "Softaculous one-click"
[install_method_softaculous_desc]
other = "If your host offers cPanel with Softaculous, ChurchCRM installs in a few clicks with no manual file upload or database setup."
[install_approach_softaculous_who]
other = "Best if your church has no technical staff."

[install_method_cpanel]
other = "Manual cPanel install"
[install_method_cpanel_desc]
other = "Create a database, upload the files with cPanel's File Manager, then open your site to run the setup wizard."
[install_approach_cpanel_who]
other = "Best if you have cPanel hosting without Softaculous."

[install_method_direct]
other = "Self-hosted server"
[install_method_direct_desc]
other = "Install on your own VPS or Linux server for full control over configuration, updates, and backups."
[install_approach_direct_who]
other = "Best if you have a system administrator or manage your own server."

[install_approach_docs]
other = "See the full guide"

[install_wizard_note]
other = "Every approach ends the same way: you open your new ChurchCRM address in a browser and a setup wizard walks you through connecting the database and creating your admin account."

[install_requirements]
other = "System Requirements"

[install_req_intro]
other = "Most shared hosting plans already meet these. Check with your provider if you are unsure."

[install_req_php]
other = "PHP"
[install_req_php_value]
other = "8.4 or newer"

