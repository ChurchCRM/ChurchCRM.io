other = "Softaculous Auto-Installer"

[install_option_softaculous_desc]
other = "One-click installation if your host has Softaculous in cPanel. A great option if you're just getting started."

[install_option_manual]
other = "Manual LAMP Setup"

[install_option_manual_desc]
other = "Manual installation using cPanel's file manager, FTP, and MySQL tools. Most common."

