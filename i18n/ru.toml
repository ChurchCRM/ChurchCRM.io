# Installation
[install_heading]
other = "Обзор установки"

[install_description]
other = "ChurchCRM устанавливается на стандартный LAMP-хостинг. Вот упрощённая схема — подробные пошаговые инструкции находятся в руководстве по установке."

[install_step_1_title]
other = "Проверьте требования"

[install_step_1_desc]
other = "Убедитесь, что на вашем сервере установлены PHP 8.4+, MySQL 8.0+ и Apache с mod_rewrite. Большинство веб-хостингов поддерживают этот стандартный стек."

[install_step_2_title]
other = "Загрузите и выгрузите файлы"

[install_step_2_desc]
other = "Скачайте ChurchCRM с GitHub, распакуйте файлы и загрузите их на свой хостинг через FTP или файловый менеджер хостинга."

[install_step_3_title]
other = "Запустите установщик"

[install_step_3_desc]
other = "Откройте URL установки в браузере и следуйте мастеру настройки. Он проведёт вас через создание базы данных и начальную конфигурацию за несколько минут."

[install_options_title]
other = "Варианты установки"

[install_option_github]
other = "Загрузка с GitHub"

[install_option_github_desc]
other = "Клонируйте или скачайте с GitHub. Полный контроль, свежие обновления, поддержка сообщества."

