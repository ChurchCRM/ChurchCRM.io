other = "Автоустановщик Softaculous"

[install_option_softaculous_desc]
other = "Установка в один клик, если ваш хостинг поддерживает Softaculous в cPanel. Идеально для начинающих!"

[install_option_manual]
other = "Ручная установка LAMP"

[install_option_manual_desc]
other = "Ручная установка с помощью файлового менеджера cPanel, FTP и инструментов MySQL. Самый распространённый способ."

