[prod_faq_a1]
other = "Да. ChurchCRM поддерживает импорт CSV для данных участников и семей, а также восстановление базы данных для полной миграции. Время настройки зависит от того, сколько потребуется очистки ваших текущих данных."

[prod_faq_a2]
other = "Плагины и интеграции существуют. Индивидуальные плагины требуют навыков разработки, но исходный код открыт — вы можете нанять кого-то, чтобы создать нужное вам решение."

[prod_faq_a3]
other = "Нет. ChurchCRM — это веб-приложение. Ваш IT-специалист может запустить его на локальном сервере, если у вас нет интернета, но это продвинутый вариант."

[prod_faq_a4]
other = "Встроенные роли и права доступа. Резервное копирование зависит от хостинга — общий хостинг обычно его включает; при самостоятельном хостинге это ваша ответственность."

