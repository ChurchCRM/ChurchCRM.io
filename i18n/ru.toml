# Install Page
[install_page_title]
other = "Установка ChurchCRM"

[install_page_subtitle]
other = "ChurchCRM — бесплатное программное обеспечение с открытым исходным кодом, которое вы размещаете самостоятельно. Выберите подход, подходящий для вашего хостинга, а затем следуйте полным инструкциям в документации."

