other = "Программа бесплатна. Хостинг — отдельно."

[install_cost_note]
other = "У ChurchCRM нет лицензионного сбора и подписки. Тем не менее вам нужно место для его размещения, поэтому вы можете платить хостинг-провайдеру за сервер, доменное имя и резервное копирование. Стоимость и трудозатраты зависят от выбранного ниже подхода."

