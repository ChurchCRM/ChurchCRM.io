[prod_fit_3]
other = "<strong>Предпочитают самостоятельный или простой хостинг</strong> — можно развернуть на доступном общем хостинге или собственном сервере."

[prod_fit_4]
other = "<strong>Работают на нескольких языках</strong> — пользуются переводами сообщества на 49 языков."

[prod_fit_intro]
other = "ChurchCRM лучше всего подходит церквям, которые:"

[prod_fit_not]
other = "<strong>ChurchCRM может не подойти, если:</strong> вашей церкви нужны интегрированные email-кампании, платные мобильные приложения, телефонная поддержка от поставщика или готовая система продажи билетов на мероприятия. Это нормально — это законные потребности, и есть продукты, созданные для них. Мы поможем вам разобраться в вариантах."

[prod_fit_title]
other = "Подходит ли ChurchCRM вашей церкви?"

[prod_hero_lead]
other = "ChurchCRM помогает церквям управлять людьми, группами, мероприятиями, пожертвованиями и волонтёрами — а вы сохраняете полный контроль над своими данными. Бесплатно. Без подписки. Открытый исходный код. Самостоятельный хостинг."

[prod_hero_title]
other = "Бесплатное ПО для управления церковью, для церквей, которые хотят оставаться организованными"

[prod_hosting_1]
other = "<strong>Существующий сервер или подаренный хостинг:</strong> 0 $/мес. Если у вашей церкви уже есть сервер или кто-то подарил хостинг, дополнительных расходов может не быть."

[prod_hosting_2]
other = "<strong>Общий хостинг:</strong> 3–10 $/мес. Простая настройка. Подходит для большинства церквей. Не требуется технических навыков сверх следования инструкциям по установке."

[prod_hosting_3]
other = "<strong>Docker / VPS:</strong> 5–50 $/мес в зависимости от трафика. ChurchCRM разрабатывается и тестируется с Docker, но официально поддерживаемого production-образа нет — ваш IT-волонтёр отвечает за поддержание контейнера в актуальном и безопасном состоянии. Полный контроль, больше ответственности."

[prod_hosting_intro]
other = "<strong>Программа бесплатна. Стоимость хостинга зависит от того, что у вас уже есть.</strong>"

[prod_hosting_intro2]
