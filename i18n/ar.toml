other = "الأنسب إذا كانت لديك استضافة cPanel بدون Softaculous."

[install_approach_direct_who]
other = "الأنسب إذا كان لديك مسؤول أنظمة أو تدير خادمك الخاص."

[install_approach_docs]
other = "عرض الدليل الكامل"

