[prod_faq_a1]
other = "نعم. يدعم ChurchCRM استيراد بيانات الأعضاء والعائلات بصيغة CSV، بالإضافة إلى استعادة قاعدة البيانات لإجراء ترحيل كامل. يعتمد وقت الإعداد على مدى الحاجة إلى تنظيف بياناتك الحالية."

[prod_faq_a2]
other = "توجد إضافات وتكاملات. تتطلب الإضافات المخصصة مهارات تطوير، لكن الكود المصدري مفتوح — يمكنك الاستعانة بمن يبني ما تحتاجه."

[prod_faq_a3]
other = "لا. ChurchCRM هو تطبيق ويب. يمكن لموظف تقنية المعلومات لديك تشغيله على خادم محلي إن لم يكن لديك إنترنت، لكن ذلك إعداد متقدم."

[prod_faq_a4]
other = "أدوار وصلاحيات مدمجة. تعتمد النسخ الاحتياطية على استضافتك — الاستضافة المشتركة تشملها عادةً؛ أما الاستضافة الذاتية فتقع مسؤوليتها عليك."

