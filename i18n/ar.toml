# Install Page
[install_page_title]
other = "تثبيت ChurchCRM"

[install_page_subtitle]
other = "ChurchCRM برنامج مجاني ومفتوح المصدر تستضيفه بنفسك. اختر الطريقة التي تناسب استضافتك، ثم اتبع الخطوات الكاملة في الوثائق."

[install_hero_image_alt]
other = "لوحة تحكم ChurchCRM، الشاشة الرئيسية بعد إتمام التثبيت"

[install_cost_title]
other = "البرنامج مجاني. الاستضافة منفصلة."

[install_cost_note]
other = "لا توجد رسوم ترخيص أو اشتراك لـ ChurchCRM. ما زلت بحاجة إلى مكان لتشغيله، لذا قد تدفع لمزود استضافة مقابل الخادم واسم النطاق والنسخ الاحتياطي. التكلفة والجهد يعتمدان على الطريقة التي تختارها أدناه."

[install_approaches_title]
other = "اختر طريقة التثبيت"

