{{ define "main" }}
<section class="ed-container ed-section ed-section--flush-top" style="max-width: 900px;">
    <p class="ed-eyebrow">{{ i18n "nav_blog" }}</p>
    <h1 class="ed-h2">{{ .Title }}</h1>
    {{ with .Description }}<p class="ed-lead">{{ . }}</p>{{ end }}
    <p style="margin-top:20px">
        <a href="{{ "tags/" | relLangURL }}" class="ed-textlink" style="margin-top:0">{{ i18n "blog_browse_tags" }} &rarr;</a>
    </p>

    {{ if .Pages }}
    <ul style="list-style:none;padding:0;margin-top:clamp(36px,5vw,56px);border-top:1px solid var(--rule)">
        {{ range .Pages.ByDate.Reverse }}{{ partial "blog-post-row.html" . }}{{ end }}
    </ul>
    {{ else }}
    <p class="ed-body" style="margin-top:32px">{{ i18n "blog_no_posts" }}</p>
    {{ end }}
</section>
{{ end }}
