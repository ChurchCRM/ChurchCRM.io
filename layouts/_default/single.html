{{ define "main" }}
<article class="ed-container ed-section ed-section--flush-top" style="max-width: 820px;">
    <h1 class="ed-h2" style="margin-bottom: clamp(28px, 4vw, 48px);">{{ .Title }}</h1>
    <div class="blog-content">
        {{ .Content }}
    </div>
    <p style="margin-top: clamp(40px, 5vw, 64px); padding-top: 28px; border-top: 1px solid var(--rule);">
        <a href="{{ "/" | relLangURL }}" class="ed-textlink" style="margin-top: 0;">&larr; {{ i18n "nav_home" }}</a>
    </p>
</article>
{{ end }}
