{{ define "main" }}
<section class="ed-container ed-section ed-section--flush-top" style="max-width: 900px;">
    <p class="ed-eyebrow">{{ i18n "nav_faq" }}</p>
    <h1 class="ed-h2">{{ .Title }}</h1>
    {{ with .Description }}<p class="ed-lead">{{ . }}</p>{{ end }}

    {{ if .Content }}
    <div class="blog-content" style="margin-top: clamp(28px, 4vw, 40px);">{{ .Content }}</div>
    {{ end }}

    <div class="accordion accordion-flush" id="faqAccordion" style="margin-top: clamp(36px, 5vw, 56px);">
        {{ range $index, $faq := .Params.faqs }}
        <div class="accordion-item">
            <h2 class="accordion-header" id="faqHeading{{ $index }}">
                <button class="accordion-button {{ if gt $index 0 }}collapsed{{ end }}" type="button" data-bs-toggle="collapse" data-bs-target="#faqCollapse{{ $index }}" aria-expanded="{{ if eq $index 0 }}true{{ else }}false{{ end }}" aria-controls="faqCollapse{{ $index }}">
                    {{ $faq.q }}
                </button>
            </h2>
            <div id="faqCollapse{{ $index }}" class="accordion-collapse collapse {{ if eq $index 0 }}show{{ end }}" aria-labelledby="faqHeading{{ $index }}" data-bs-parent="#faqAccordion">
                <div class="accordion-body blog-content">
                    {{ $faq.a | markdownify }}
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</section>

{{ if .Params.faqs }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
        {{- range $index, $faq := .Params.faqs }}
        {{- if gt $index 0 }},{{ end }}
        {
            "@type": "Question",
            "name": {{ $faq.q | strings.TrimPrefix "\"" | strings.TrimSuffix "\"" | jsonify | safeJS }},
            "acceptedAnswer": {
                "@type": "Answer",
                "text": {{ $faq.a | markdownify | plainify | jsonify | safeJS }}
            }
        }
        {{- end }}
    ]
}
</script>
{{ end }}
{{ end }}
