<!DOCTYPE html>
<html lang="{{ .Language.Lang }}" dir="{{ cond (in (slice "ar") .Language.Lang) "rtl" "ltr" }}">
<head>
    {{- partial "head" . -}}
</head>
<body>
    {{- partial "navbar" . -}}
    <main>
        {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer" . -}}
    {{- partial "fabs" . -}}

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
