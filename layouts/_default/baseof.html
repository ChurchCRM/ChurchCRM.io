<!DOCTYPE html>
<html lang="{{ .Language.Lang }}" dir="{{ cond (in (slice "ar") .Language.Lang) "rtl" "ltr" }}">
<head>
    {{- partial "head" . -}}
</head>
<body>
    {{- partial "navbar" . -}}
    <main>
        {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer" . -}}
    {{- partial "fabs" . -}}

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Conversion-funnel click tracking (GA4, see static/js/conversion-tracking.js) -->
    <script src="{{ "js/conversion-tracking.js" | relURL }}" defer></script>
</body>
</html>
