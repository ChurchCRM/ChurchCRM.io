            <!-- Quick Start -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <h2 style="margin-bottom: 2rem;">Choose Your Installation Method</h2>
                    <div class="alert-info-custom">
                        <i class="fas fa-lightbulb"></i>
                        <strong>Already have a website?</strong> If your church has an existing website with cPanel hosting, you likely already have everything needed to run ChurchCRM at no additional cost!
                    </div>

            </div>

            <!-- Installation Methods - Three Options -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div class="alert-info-custom">
                        <i class="fas fa-info-circle"></i>
                        <strong>Root Domain vs Subdirectory:</strong> You can install ChurchCRM on your root domain (yourchurch.org) or in a subdirectory (yourchurch.org/crm). All methods support both options. Choose based on your preference and whether you have an existing website.
                    </div>
                </div>
            </div>

            <!-- Installation Methods - Three Options -->
            <div class="row mb-5">
                <div class="col-lg-4 mb-3">
                    <div class="step-card" style="border-left-color: #28a745;">
                        <div class="step-number" style="background: linear-gradient(135deg, #28a745, #20c997);">1</div>
                        <h3><i class="fas fa-star" style="color: #ffc107; margin-right: 0.5rem;"></i>Softaculous (Easiest)</h3>
                        <p style="margin: 1rem 0;">One-click installation if your hosting has Softaculous plugin in cPanel. Perfect for beginners!</p>
                        <a href="#softaculous" class="btn-primary-gradient" style="font-size: 0.9rem; padding: 8px 14px;">Learn How →</a>
                    </div>
                </div>
                <div class="col-lg-4 mb-3">
                    <div class="step-card" style="border-left-color: #0066cc;">
                        <div class="step-number" style="background: linear-gradient(135deg, #0066cc, #0052a3);">2</div>
                        <h3><i class="fas fa-cogs" style="margin-right: 0.5rem;"></i>cPanel Manual</h3>
                        <p style="margin: 1rem 0;">Manual installation using cPanel's file manager, FTP, and MySQL tools. Most common approach.</p>
                        <a href="#cpanel-manual" class="btn-primary-gradient" style="font-size: 0.9rem; padding: 8px 14px;">Learn How →</a>
                    </div>
                </div>
                <div class="col-lg-4 mb-3">
                    <div class="step-card" style="border-left-color: #667eea;">
                        <div class="step-number" style="background: linear-gradient(135deg, #667eea, #764ba2);">3</div>
                        <h3><i class="fas fa-download" style="margin-right: 0.5rem;"></i>Direct Download</h3>
                        <p style="margin: 1rem 0;">Download and install manually on any hosting with LAMP (Linux, Apache, MySQL, PHP).</p>
                        <a href="#direct-download" class="btn-primary-gradient" style="font-size: 0.9rem; padding: 8px 14px;">Learn How →</a>
                    </div>
                </div>
            </div>

            <!-- System Requirements -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <h2 style="margin-bottom: 2rem;">System Requirements</h2>
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="step-card">
                                <h4><i class="fas fa-server"></i> Server Requirements</h4>
                                <ul style="margin-top: 1rem; margin-left: 1rem;">
                                    <li><strong>PHP:</strong> 8.2 or higher (required for v6.0.0+)</li>
                                    <li><strong>Database:</strong> MySQL 8.0.11+ or MariaDB 10.5+</li>
                                    <li><strong>Web Server:</strong> Apache 2.4+ with mod_rewrite</li>
                                    <li><strong>Memory:</strong> 256MB minimum (512MB+ recommended)</li>
                                    <li><strong>Execution Time:</strong> 30+ seconds minimum (60+ for imports)</li>
                                    <li><strong>Disk Space:</strong> Minimum 500MB available</li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="step-card">
                                <h4><i class="fas fa-cube"></i> PHP Extensions Required</h4>
                                <ul style="margin-top: 1rem; margin-left: 1rem; font-size: 0.9rem;">
                                    <li>php-bcmath, php-curl, php-exif, php-gd</li>
                                    <li>php-gettext, php-intl, php-json, php-mbstring</li>
                                    <li>php-mysqli, php-soap, php-sodium, php-xml, php-zip</li>
                                </ul>
                                <p style="margin-top: 1rem; font-size: 0.85rem; color: #666;">Most hosting providers include these by default</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Database Permissions -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div class="step-card" style="border-left: 4px solid #667eea;">
                        <h4><i class="fas fa-shield-alt"></i> Database User Permissions</h4>
                        <p style="margin-top: 1rem;">The database user you create must have the following permissions for ChurchCRM to function properly:</p>
                        <ul style="margin-top: 1rem; margin-left: 1rem;">
                            <li><strong>CREATE:</strong> To create tables and indexes</li>
                            <li><strong>ALTER:</strong> To modify table structures during updates</li>
                            <li><strong>SELECT, INSERT, UPDATE, DELETE:</strong> To read and write data</li>
                            <li><strong>EXECUTE:</strong> To run stored procedures</li>
                            <li><strong>CREATE VIEW:</strong> To create database views</li>
                        </ul>
                        <p style="margin-top: 1rem; color: #666; font-size: 0.95rem;"><i class="fas fa-info-circle"></i> <strong>Tip:</strong> In cPanel, selecting "ALL PRIVILEGES" automatically grants all necessary permissions.</p>
                    </div>
                </div>
            </div>

            <!-- File Upload & PHP Configuration -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div class="step-card" style="border-left: 4px solid #667eea;">
                        <h4><i class="fas fa-file-upload"></i> File Upload & PHP Configuration</h4>
                        <p style="margin-top: 1rem;">Ensure these PHP settings are configured correctly:</p>
                        <ul style="margin-top: 1rem; margin-left: 1rem;">
                            <li><strong>file_uploads:</strong> Must be <code>On</code></li>
                            <li><strong>upload_max_filesize:</strong> 10MB+ recommended</li>
                            <li><strong>post_max_size:</strong> Should match or exceed upload_max_filesize</li>
                            <li><strong>memory_limit:</strong> 256MB minimum (512MB+ recommended)</li>
                            <li><strong>max_execution_time:</strong> 30+ seconds minimum (60+ for large imports)</li>
                        </ul>
                        <p style="margin-top: 1rem; color: #666; font-size: 0.95rem;"><i class="fas fa-info-circle"></i> <strong>Tip:</strong> Most shared hosting providers have these configured by default. Contact your host if you need adjustments.</p>
                    </div>
                </div>
            </div>

            <!-- Installation Location Guide -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div class="step-card" style="background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05)); border-left: 4px solid #667eea;">
                        <h4><i class="fas fa-map-location-dot"></i> Installation Location: Root Domain vs Subdirectory</h4>
                        <p style="margin-top: 1rem;">You have flexibility in where you install ChurchCRM. Choose based on your needs:</p>
                        
                        <div style="margin-top: 1.5rem;">
                            <h5 style="color: #28a745; margin-bottom: 0.5rem;"><i class="fas fa-check-circle"></i> Root Domain (yourchurch.org)</h5>
                            <ul style="margin-left: 1rem; margin-bottom: 1.5rem;">
                                <li><strong>Best for:</strong> Churches that want ChurchCRM as their main website</li>
                                <li><strong>URL:</strong> yourchurch.org</li>
                                <li><strong>How:</strong> Leave the directory field blank during installation</li>
                                <li><strong>Advantage:</strong> Simpler URL, no subdirectory path needed</li>
                            </ul>
                        </div>

                        <div>
                            <h5 style="color: #0066cc; margin-bottom: 0.5rem;"><i class="fas fa-check-circle"></i> Subdirectory (yourchurch.org/crm)</h5>
                            <ul style="margin-left: 1rem;">
                                <li><strong>Best for:</strong> Churches with existing websites who want ChurchCRM alongside other content</li>
                                <li><strong>URL:</strong> yourchurch.org/crm (or yourchurch.org/churchcrm, etc.)</li>
                                <li><strong>How:</strong> Type the subdirectory name (e.g., <code>crm</code>) during installation</li>
                                <li><strong>Advantage:</strong> Keep your existing website intact, run ChurchCRM in its own folder</li>
                            </ul>
                        </div>

                        <p style="margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 6px; color: #666;"><i class="fas fa-lightbulb"></i> <strong>Common Question:</strong> "Can I change this later?" - Yes, but it requires moving files and updating configuration. Choose carefully during initial installation.</p>
                    </div>
                </div>
            </div>

                    <h2 style="margin-bottom: 2rem;">Detailed Installation Steps</h2>

            <!-- SOFTACULOUS - EASIEST -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div id="softaculous" class="step-card" style="background: linear-gradient(135deg, rgba(40, 167, 69, 0.05), rgba(32, 201, 151, 0.05)); border-left: 5px solid #28a745;">
                        <h3><i class="fas fa-star" style="color: #ffc107; margin-right: 0.5rem;"></i>Method 1: Softaculous (One-Click Installation)</h3>
                        <p style="margin-top: 1rem; font-size: 1.05rem;"><strong>Recommended if available on your hosting</strong> - Easiest and fastest way to get started!</p>
                        
                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 1: Check if Softaculous is Available</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Log into your cPanel account</li>
                            <li>Look for <strong>"Softaculous"</strong> or <strong>"Application Installer"</strong> in the "Software" section</li>
                            <li>If you see it, you have Softaculous installed!</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 2: Search for ChurchCRM</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Click on <strong>Softaculous</strong> in cPanel</li>
                            <li>In the search box, type <strong>"ChurchCRM"</strong></li>
                            <li>The ChurchCRM application should appear in the search results</li>
                            <li>Click on the ChurchCRM icon to view details</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 3: Begin Installation</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Click the green <strong>"Install Now"</strong> button</li>
                            <li>You'll see the installation form with several options</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 4: Configure Installation Settings</h5>
                        <p style="margin-bottom: 1rem;"><strong>Fill in these fields:</strong></p>
                        <ul style="margin-left: 1rem; margin-bottom: 1rem;">
                            <li><strong>Choose Installation URL:</strong> Select your primary domain (or a subdomain if you created one separately)</li>
                            <li><strong>Directory:</strong> 
                                <ul style="margin-top: 0.5rem; margin-bottom: 0.5rem;">
                                    <li><strong>Root Installation:</strong> Leave blank to install at your domain root (yourchurch.org)</li>
                                    <li><strong>Subdirectory Installation:</strong> Type a subdirectory name (e.g., <code>crm</code> or <code>churchcrm</code>) to install at yourchurch.org/crm</li>
                                </ul>
                            </li>
                            <li><strong>Admin Username:</strong> Create a secure admin username</li>
                            <li><strong>Admin Password:</strong> Create a strong password</li>
                            <li><strong>Admin Email:</strong> Enter the admin email address</li>
                            <li><strong>Site Name:</strong> Enter your church name or organization name</li>
                        </ul>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 5: Complete Installation</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Click <strong>"Install"</strong> button</li>
                            <li>Softaculous will handle everything - database creation, file uploads, configuration</li>
                            <li>Installation typically completes in 2-5 minutes</li>
                            <li>You'll receive confirmation with your admin login information</li>
                            <li>Visit your ChurchCRM URL and log in with the credentials you created</li>
                        </ol>

                        <div class="alert-info-custom" style="margin-top: 2rem;">
                            <i class="fas fa-lightbulb"></i> <strong>That's it!</strong> Softaculous automates everything. No technical knowledge required!
                        </div>
                    </div>
                </div>
            </div>

            <!-- cPANEL MANUAL -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div id="cpanel-manual" class="step-card" style="background: linear-gradient(135deg, rgba(0, 102, 204, 0.05), rgba(0, 82, 163, 0.05)); border-left: 5px solid #0066cc;">
                        <h3><i class="fas fa-cogs"></i> Method 2: cPanel Manual Installation</h3>
                        <p style="margin-top: 1rem; font-size: 1.05rem;">If Softaculous isn't available, follow these manual steps using cPanel tools.</p>
                        
                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 1: Create MySQL Database</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>In cPanel, find and click <strong>"MySQL Databases"</strong></li>
                            <li>In "Create New Database", enter a name like <strong>churchcrm_db</strong> and click "Create Database"</li>
                            <li>Then click <strong>"MySQL Users"</strong> and create a new user with a strong password</li>
                            <li>Go back to "MySQL Databases" and add the user to the database with <strong>ALL PRIVILEGES</strong></li>
                            <li>Note your database name, username, and password for later</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 2: Download ChurchCRM</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Download the latest release from <a href="https://github.com/ChurchCRM/CRM/releases/latest" target="_blank" style="color: #0066cc; font-weight: 600;">GitHub Releases</a></li>
                            <li>Unzip the file on your computer (you'll see a folder called "churchcrm")</li>
                            <li>Get all the files from inside the "churchcrm" folder ready to upload</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 3: Upload Files via cPanel File Manager</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>In cPanel, click <strong>"File Manager"</strong></li>
                            <li>Navigate to the location for your installation:
                                <ul style="margin-top: 0.5rem; margin-bottom: 0.5rem;">
                                    <li><strong>Root Domain Installation:</strong> Navigate to <strong>"public_html"</strong> and upload files directly here (visible at yourchurch.org)</li>
                                    <li><strong>Subdirectory Installation:</strong> Navigate to <strong>"public_html"</strong>, create a new folder (e.g., <code>crm</code>), then upload files there (visible at yourchurch.org/crm)</li>
                                </ul>
                            </li>
                            <li>Upload all ChurchCRM files:
                                <ul style="margin-top: 0.5rem;">
                                    <li>Click <strong>"Upload"</strong> button</li>
                                    <li>Drag and drop all ChurchCRM files, or select them from your computer</li>
                                </ul>
                            </li>
                            <li>Wait for upload to complete</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 4: Set File Permissions</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>In File Manager, select all uploaded ChurchCRM files</li>
                            <li>Right-click and select <strong>"Change Permissions"</strong></li>
                            <li>Set permissions to <strong>644</strong> for files and <strong>755</strong> for folders</li>
                            <li>Click "Change Permissions" button</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 5: Run Installation Wizard</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Open your browser and go to your ChurchCRM URL (e.g., <code>yourchurch.org/churchcrm</code>)</li>
                            <li>The installation wizard will load automatically</li>
                            <li>Enter your database information you created in Step 1</li>
                            <li>Create your admin account and configure basic settings</li>
                            <li>Complete the wizard</li>
                        </ol>

                        <div class="alert-info-custom" style="margin-top: 2rem;">
                            <i class="fas fa-book"></i> <strong>Need more help?</strong> See the <a href="https://github.com/ChurchCRM/CRM/wiki/Installing-ChurchCRM-in-cPanel-shared-hosting" target="_blank" style="color: #0066cc;">cPanel Installation Guide</a> on GitHub
                        </div>
                    </div>
                </div>
            </div>

            <!-- DIRECT DOWNLOAD -->
            <div class="row mb-5">
                <div class="col-lg-12">
                    <div id="direct-download" class="step-card" style="background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05)); border-left: 5px solid #667eea;">
                        <h3><i class="fas fa-download"></i> Method 3: Direct Download (Any LAMP Hosting)</h3>
                        <p style="margin-top: 1rem; font-size: 1.05rem;">For any web hosting with PHP and MySQL (not just cPanel).</p>
                        
                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 1: Download Latest Release</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Go to <a href="https://github.com/ChurchCRM/CRM/releases/latest" target="_blank" style="color: #667eea;">ChurchCRM Releases</a></li>
                            <li>Download the zip file for the latest stable version</li>
                            <li>Unzip on your computer</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 2: Create Database</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Use your hosting control panel to create a MySQL database and user</li>
                            <li>Note the database name, username, and password</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 3: Upload Files via FTP or File Manager</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Connect via FTP or use your hosting's file manager</li>
                            <li>Navigate to the installation location:
                                <ul style="margin-top: 0.5rem; margin-bottom: 0.5rem;">
                                    <li><strong>Root Domain Installation:</strong> Upload files to your web root (usually called <code>public_html</code>, <code>www</code>, or <code>httpdocs</code>) so ChurchCRM is at yourchurch.org</li>
                                    <li><strong>Subdirectory Installation:</strong> Create a subdirectory (e.g., <code>crm</code>) in your web root and upload files there so ChurchCRM is at yourchurch.org/crm</li>
                                </ul>
                            </li>
                            <li>Set file permissions: files to 644, folders to 755</li>
                        </ol>

                        <h5 style="margin-top: 2rem; margin-bottom: 1rem;">Step 4: Access and Configure</h5>
                        <ol style="line-height: 1.8; margin-left: 1rem;">
                            <li>Visit your ChurchCRM URL in a browser</li>
                            <li>The setup wizard will appear</li>
                            <li>Enter your database credentials</li>
                            <li>Complete the configuration</li>
                        </ol>

                        <div class="alert-info-custom" style="margin-top: 2rem;">
                            <i class="fas fa-book"></i> Full documentation available at <a href="https://github.com/ChurchCRM/CRM/wiki" target="_blank" style="color: #667eea;">GitHub Wiki</a>
                        </div>
                    </div>
